name: gpt-6-luna
base_url: https://api.openai.com/v1
model: gpt-6-luna
api_key_env: OPENAI_API_KEY
max_tokens_field: max_completion_tokens
workers: 16
# OpenAI standard prices, USD per million tokens (developers.openai.com/api/docs/pricing, 2026-10-13).
price_in_per_m: 0.10
price_out_per_m: 0.50
thinking: false
json_schema: true
send_template_kwargs: false
# No reasoning tokens: the same "no thinking" setting as the Gemma teachers.
extra_body:
  reasoning_effort: none
pins:
  provider: openai
  family: OpenAI GPT-6
  precision: hosted
  checked: "2026-10-13: max_completion_tokens, reasoning_effort none and temperature 0 accepted"
