cleanconll:
  PER: Names or aliases of individual people, animals, or fictional characters.
  LOC: Names of geographical areas, natural features, routes, buildings, or places, interpreted in context.
  ORG: Names of organizations, institutions, companies, publications, brands, teams, or other organized groups.
  MISC: Other named entities, including nationalities, languages, affiliations, events, works, ideologies, and expressions derived from names.
bc5cdr:
  Chemical: Named chemicals or drugs with identifiable composition, including structurally defined classes, abbreviations, and specified small biochemical substances.
  Disease: Disease or disorder mentions, including signs, symptoms, toxicity, and corresponding abbreviations or adjectival forms.
mit_movie:
  ACTOR: Name of a performer appearing in a movie.
  CHARACTER: Name of a character portrayed in a movie.
  DIRECTOR: Name of a person who directs a movie.
  GENRE: Category describing a movie's genre or style.
  PLOT: Description of a movie's story, subject, events, setting, or character situation.
  RATING: Content or age suitability classification assigned to a movie.
  RATINGS_AVERAGE: Numerical score or qualitative aggregate assessment of a movie's quality or popularity.
  REVIEW: Reference to a movie review, critical assessment, or viewer opinion.
  SONG: Title of a song associated with a movie.
  TITLE: Title of a movie.
  TRAILER: Reference to a movie trailer, preview, or promotional clip.
  YEAR: Year, decade, or relative period associated with a movie's release.
crossre:
  artifact: The head is a concrete product or work created by the tail.
  cause-effect: The head causes or produces the tail as an effect.
  compare: The text compares the two entities; order them by appearance.
  general-affiliation: The head has the religion, ethnicity, nationality affiliation, or genre represented by the tail.
  named: The head names or abbreviates the tail; equivalent coreferential mentions follow text order.
  opposite: The entities oppose each other physically or conceptually; order them by appearance.
  origin: The head is an abstract concept, invention, or designation originating from the tail.
  part-of: The head forms a component, constituent, or part of the tail.
  physical: The tail specifies the head's location, proximity, destination, residence, or geographical origin.
  related-to: An explicit relation connects the entities but fits no other type; exclusive, with mentions in text order.
  role: The head holds an active professional, organizational, civic, or participation role relative to the tail.
  social: The entities have a personal or family relationship rather than a business role; order them by appearance.
  temporal: The head occurs or exists during the event represented by the tail.
  topic: The head concerns or focuses on the tail.
  type-of: The tail states the head's general category, property, or characteristic.
  usage: The head uses the tail to perform its function or accomplish a purpose.
  win-defeat: The head wins the tail award; competing parties follow text order, whether victory or defeat.
hallmarks:
  activating invasion and metastasis: Cancer cells invade surrounding tissue or spread from their original site to distant body locations.
  avoiding immune destruction: Cancer cells escape recognition or elimination by the immune system.
  cellular energetics: Cancer cells alter energy metabolism to support growth, including glucose fermentation despite available oxygen.
  enabling replicative immortality: Cancer cells bypass normal limits on repeated division and maintain indefinite proliferative capacity.
  evading growth suppressors: Cancer cells disable or bypass mechanisms that normally restrain growth and division.
  genomic instability and mutation: Genetic mutations and chromosome abnormalities accumulate through unstable genome maintenance.
  inducing angiogenesis: Tumors stimulate new blood vessel formation to obtain oxygen and nutrients.
  resisting cell death: Cancer cells evade programmed cell death that would normally eliminate damaged or abnormal cells.
  sustaining proliferative signaling: Cancer cells maintain growth and division signals without normal dependence on external stimulation.
  tumor promoting inflammation: Inflammatory processes create conditions that support tumor growth, survival, or spread.
