[project]
name = "active-gliner"
version = "0.2.0.dev0"
description = "Active learning and LLM label distillation for GLiNER"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "gliner2[train]==2.0.0",
    "datasets",
    "pandas",
    "matplotlib",
    "pydantic>=2",
    "protobuf",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "optuna==4.5.0",
    "scikit-learn==1.7.2",
    "deepsig==1.2.8",
    "python-dotenv==1.2.3",
    "threadpoolctl==3.7.0",
]

[project.scripts]
active-gliner = "active_gliner.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "active_gliner"
module-root = "src"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads the real student model (slow)", "teacher: calls a live teacher server"]
